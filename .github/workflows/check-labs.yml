name: Verificar LABS offline
on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Testar o domínio e a proteção de fala
        run: node --test apps/decisions/tests/*.test.mts
      - name: Testar o ponto de partida
        run: node --test exercises/ticket-router/starter/router.test.mjs
      - name: Testar a solução de referência
        run: node --test exercises/ticket-router/solution/router.test.mjs
      - name: Conferir links locais da documentação
        run: node scripts/check-doc-links.mjs
